// What the Fabric bands of Minecraft 1.20 - 1.21.11 (versions/fabric/1.2*) share. A band's build.gradle applies the Loom
// and java plugins, then sets ext.band and applies this file:
//   target   - the suffix of the band's jar (despawn-indicator-fabric-<version>+<target>.jar)
//   props    - the prefix of its versions in gradle.properties (<props>_minecraft, _fabric_loader, _fabric_api)
//   java     - the Java its Minecraft needs (17 or 21, default 21)
//   gametest - whether the band runs the client gametest (Fabric API has it for 1.21.2 and later)
// Fabric runs with intermediary names, which stay the same for a method whose signature does not change, so a
// band's one jar runs on every version of its range.

// Its jar carries the classes of ':common', so that module is configured first (configure-on-demand)
evaluationDependsOn(':common')

version = "${project.mod_version}+${band.target}"

base {
    archivesName = "despawn-indicator-fabric"
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc/src/main/java"
            srcDir "${rootDir}/shared/fabric/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.property(band.props + '_minecraft')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.property(band.props + '_fabric_loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property(band.props + '_fabric_api')}"
}

def bandJava = band.java ?: 21

tasks.withType(JavaCompile).configureEach {
    options.release = bandJava
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.toVersion(bandJava)
    targetCompatibility = JavaVersion.toVersion(bandJava)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}

if (band.gametest) {
    // In-game test (Fabric client gametest, run by .github/workflows/ingame.yml): drops items in a real world,
    // checks the server half sends their despawn times and takes screenshots.
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'despawnindicator-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }

    sourceSets {
        gametest {
            java {
                srcDir "${rootDir}/shared/gametest/src/java"
            }
            // The mod's texts: in the dev client ':common' is a plain library, so its assets are not loaded
            resources {
                srcDir "${rootDir}/common/src/main/resources"
                // only the assets of ':common', but the gametest's own fabric.mod.json too
                exclude "despawnindicator-build.properties"
            }
        }
    }
}

// The loader's Mixin for 1.20 - 1.21.x does not run on Java 25, so the dev clients and servers run on Java 21
tasks.matching { it.name in ['runClient', 'runServer', 'runClientGameTest'] }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The classpath with Fabric's intermediary names, the ones the released jar runs with: Minecraft, its
// libraries, the loader and Fabric API as published. The compatibility check (.github/workflows/compat.yml)
// compares the jar against it for each Minecraft version of the band.
tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        // Loom's classes are not visible to this applied script, so the namespace is looked up by name
        def loom = project.extensions.getByName('loom')
        def namespaces = loom.class.classLoader.loadClass('net.fabricmc.loom.api.mappings.layered.MappingsNamespace')
        def minecraft = loom.getMinecraftJars(namespaces.valueOf('INTERMEDIARY'))
        def files = minecraft*.toFile() + configurations.minecraftLibraries.files +
                configurations.modCompileClasspath.files
        out.get().asFile.text = files.join('\n') + '\n'
    }
}
