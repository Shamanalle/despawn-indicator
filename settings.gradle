pluginManagement {
    repositories {
        maven { url = uri("https://maven.fabricmc.net/") }
        maven { url = uri("https://maven.neoforged.net/releases/") }
        maven { url = uri("https://maven.minecraftforge.net/") }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Java toolchains the Java 8 build of the common code (gradle/jabel.gradle) and the loaders may ask for
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "despawn-indicator"

include "common"
include "common-j8"

// The Minecraft modules live in versions/<loader>/<band> and keep the project name <loader>-<band>
// (:fabric-1.21 is versions/fabric/1.21). Each band is built against one Minecraft version and runs
// on the range in its metadata; the root build merges the bands of a loader into one jar.
def bands = [
        fabric  : ['1.21', '26'],
        forge   : ['1.20.1'],
        neoforge: ['1.21'],
]
bands.each { loader, list ->
    list.each { band ->
        include "${loader}-${band}"
        project(":${loader}-${band}").projectDir = file("versions/${loader}/${band}")
    }
}

include "universal"
// The server plugin for Paper, Folia and Spigot
include "plugin"
include "packaging"
