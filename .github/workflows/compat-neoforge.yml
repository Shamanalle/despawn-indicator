name: NeoForge compatibility

# One NeoForge band per range of Minecraft versions, each built against one NeoForge version of its range,
# and all of them merged into the one Forge / NeoForge jar. This checks each band's classes on the newest
# NeoForge of every Minecraft version of its range and on the oldest NeoForge it allows: every class,
# method, field, override and abstract method it uses resolves the same way as on the NeoForge it is
# built against (LinkCheck.java), apart from the reviewed differences in
# linkcheck-allowed-neoforge-<band>.txt.
# The NeoForge versions come from NeoForge's maven.

on:
  pull_request:
    paths:
      - 'versions/neoforge/**'
      - 'shared/mc/**'
      - 'shared/mc-1.20/**'
      - 'common/src/main/**'
      - 'gradle.properties'
      - '.github/scripts/LinkCheck.java'
      - '.github/scripts/linkcheck-allowed-neoforge-*.txt'
      - '.github/workflows/compat-neoforge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: List the NeoForge releases of each band
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false
      - name: NeoForge releases
        id: list
        run: |
          # module, its prefix in gradle.properties, the first and the last NeoForge line (none: open).
          # A line is one Minecraft version: 21.4 is Minecraft 1.21.4, 26.1.2 is Minecraft 26.1.2
          bands='neoforge-1.21 nf121 21.0 21.1
          neoforge-1.21.2 nf1212 21.2 21.5
          neoforge-1.21.6 nf1216 21.6 21.8
          neoforge-1.21.9 nf1219 21.9 21.10
          neoforge-1.21.11 nf12111 21.11 21.11
          neoforge-26 nf26 26 -'
          all=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oP '<version>\K[^<]+' | sort -V)
          # a <= b in version order
          le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }
          # 21.4.161 -> 21.4, 26.1.2.122 -> 26.1.2
          line() { case "$1" in 2[0-5].*) cut -d. -f1-2 <<< "$1" ;; *) cut -d. -f1-3 <<< "$1" ;; esac; }
          entries=()
          while read -r module props first last; do
            reference=$(grep "^${props}_neoforge=" gradle.properties | cut -d= -f2)
            oldest=$(grep "^${props}_neoforge_oldest=" gradle.properties | cut -d= -f2)
            declare -A newest=()
            for v in ${all}; do
              l=$(line "${v}")
              le "${first}" "${l}" || continue
              if [ "${last}" != "-" ]; then
                le "${l}" "${last}" || continue
              fi
              newest[${l}]=${v}
            done
            if [ "${#newest[@]}" -eq 0 ]; then
              echo "::error::No NeoForge release of ${module} found"
              exit 1
            fi
            for v in $(printf '%s\n' "${oldest}" "${newest[@]}" | sort -uV); do
              [ "${v}" = "${reference}" ] && continue
              echo "${module}: NeoForge ${v}"
              entries+=("$(jq -cn --arg module "${module}" --arg neoforge "${v}" '{module: $module, neoforge: $neoforge}')")
            done
            unset newest
          done <<< "${bands}"
          echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -cs '{include: .}')" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.module }} on NeoForge ${{ matrix.neoforge }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build the jar for the reference version
        env:
          MODULE: ${{ matrix.module }}
        run: |
          ./gradlew :${MODULE}:assemble :${MODULE}:writeCompileClasspath --no-daemon
          dir="versions/neoforge/${MODULE#neoforge-}"
          cp $(ls "${dir}"/build/libs/*.jar | grep -v -- -sources | head -1) "${RUNNER_TEMP}/mod.jar"
          cp "${dir}/build/compile-classpath.txt" "${RUNNER_TEMP}/reference-classpath.txt"

      - name: Classpath of NeoForge ${{ matrix.neoforge }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          ./gradlew :${MODULE}:writeCompileClasspath --no-daemon -PloaderOverride.${MODULE}=${{ matrix.neoforge }}
          cp "versions/neoforge/${MODULE#neoforge-}/build/compile-classpath.txt" "${RUNNER_TEMP}/target-classpath.txt"

      - name: Check the reference jar links against NeoForge ${{ matrix.neoforge }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          allowed=".github/scripts/linkcheck-allowed-${MODULE}.txt"
          [ -f "${allowed}" ] || allowed=""
          status=0
          java .github/scripts/LinkCheck.java "${RUNNER_TEMP}/mod.jar" \
            "${RUNNER_TEMP}/reference-classpath.txt" "${RUNNER_TEMP}/target-classpath.txt" \
            ${allowed} > "${RUNNER_TEMP}/link.txt" 2>&1 || status=$?
          cat "${RUNNER_TEMP}/link.txt"
          {
            echo "### ${MODULE} on NeoForge ${{ matrix.neoforge }}"
            echo '```'
            tail -200 "${RUNNER_TEMP}/link.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"
