name: Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test & build all targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 25 compiles every module; older targets use --release 17 / 21
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (protocol, countdown, texts, translations)
        run: ./gradlew :common:test --no-daemon

      - name: Build every Minecraft target
        run: ./gradlew build --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: despawn-indicator
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: common/build/reports/tests/

  # Each Forge / NeoForge jar serves a band of Minecraft versions: it is built against the newest loader
  # of the band, and here also compiled against the oldest, so a call missing there fails the build
  oldest:
    name: Oldest loader of ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: forge-1.20.1, key: forge120_version_oldest }
          - { module: neoforge-1.21, key: nf121_neoforge_oldest }
          - { module: neoforge-1.21.2, key: nf1212_neoforge_oldest }
          - { module: neoforge-1.21.6, key: nf1216_neoforge_oldest }
          - { module: neoforge-1.21.9, key: nf1219_neoforge_oldest }
          - { module: neoforge-1.21.11, key: nf12111_neoforge_oldest }
          # No neoforge-26: it calls classes 26.1 lacks where it runs only on newer versions (GuiCanvas),
          # so it cannot compile against 26.1; NeoForge compatibility checks it there instead
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile against the oldest loader
        run: |
          chmod +x gradlew
          oldest=$(grep "^${{ matrix.key }}=" gradle.properties | cut -d= -f2)
          echo "${{ matrix.module }} against ${oldest}"
          ./gradlew :${{ matrix.module }}:compileJava -PloaderOverride.${{ matrix.module }}=${oldest} --configure-on-demand --no-daemon
