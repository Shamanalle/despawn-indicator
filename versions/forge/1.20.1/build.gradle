plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'java'
}

// Its jar carries the classes of ':common', so that module is configured first (configure-on-demand)
evaluationDependsOn(':common')

// Forge 1.20 - 1.20.1, and NeoForge for 1.20.1 (a fork of Forge that loads Forge mods). The code shared with
// the other bands is compiled here against Minecraft's own names and turned into Forge's runtime names by
// reobfJar; only the hooks into Forge (package com.kasper.despawnindicator.forge) and Platform are Forge's own.
def target = "mc1.20.1"
version = "${project.mod_version}+${target}"

base {
    archivesName = "despawn-indicator-forge"
}

repositories {
    mavenCentral()
}

// The build against the oldest Forge it supports (1.20, .github/workflows/build.yml) passes -PloaderOverride.forge-1.20.1=<version>
legacyForge {
    version = project.findProperty("loaderOverride.${project.name}") ?: project.forge120_version
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}
