plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Minecraft 1.16.5 (Java 8, so the common classes come from ':common-j8' and Jabel compiles the band's sources).
// The channels and the HUD are those of 1.16.5 - 1.19.4 (shared/fabric-1.16); the item renderer, Compat,
// ClientCompat and the log are the band's own, since 1.16.5 registers renderers differently, marks no entity
// unloaded with its chunk and has no SLF4J. The command uses the v1 command API. Fabric API for 1.16.5 has no
// client gametest, so CI starts this band on a server only.
ext.band = [target: 'mc1.16.5', props: 'mc1165', java: 8, gametest: false, ownCompat: true, commandV1: true, shared: ['fabric-1.16']]
apply from: "${rootDir}/gradle/fabric-band.gradle"
