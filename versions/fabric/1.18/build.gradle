plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Minecraft 1.18.2 (Java 17). The channels, the item renderer and the HUD are the same as on 1.19.x
// (shared/fabric-1.18). Its own are Compat and ClientCompat (texts and sounds changed in 1.19) and
// ModCommands (Fabric API has only the v1 command API). Fabric API for 1.18.2 has no client gametest,
// so CI starts this band on a server only.
ext.band = [target: 'mc1.18.2', props: 'mc1182', java: 17, gametest: false, ownCompat: true, commandV1: true, shared: ['fabric-1.18']]
apply from: "${rootDir}/gradle/fabric-band.gradle"
