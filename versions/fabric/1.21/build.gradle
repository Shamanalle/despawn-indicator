plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Minecraft 1.21 - 1.21.1, compiled against 1.21.1: items are drawn in one call with the entity (render).
// Fabric API for 1.21.1 has no client gametest, so CI starts this band on a server only.
ext.band = [target: 'mc1.21-1.21.1', props: 'mc1210', gametest: false]
apply from: "${rootDir}/gradle/fabric-band.gradle"
