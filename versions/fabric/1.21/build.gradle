plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

// Its jar carries the classes of ':common', so that module is configured first (configure-on-demand)
evaluationDependsOn(':common')

// Minecraft 1.21 - 1.21.11 (compiled against 1.21.8, see gradle.properties). Fabric runs with intermediary names,
// which stay the same for a method whose signature does not change, so this one jar runs on every 1.21.x.
def target = "mc1.21.x"
version = "${project.mod_version}+${target}"

base {
    archivesName = "despawn-indicator-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc/src/main/java"
            srcDir "${rootDir}/shared/fabric/src/main/java"
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc121_minecraft}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.mc121_fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.mc121_fabric_api}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}

// In-game test (Fabric client gametest, run by .github/workflows/ingame.yml): drops items in a real world,
// checks the server half sends their despawn times and takes screenshots.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'despawnindicator-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    gametest {
        java {
            srcDir "${rootDir}/shared/gametest/src/java"
        }
        // The mod's texts: in the dev client ':common' is a plain library, so its assets are not loaded
        resources {
            srcDir "${rootDir}/common/src/main/resources"
            include "assets/**"
        }
    }
}

// The loader's Mixin for 1.21 does not run on Java 25, so the test client runs on Java 21
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
