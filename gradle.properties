# Gradle
org.gradle.jvmargs=-Xmx3G
# JDK 17 for the Java 8 build of the common code (gradle/jabel.gradle), found on the runner or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
# Set up only the modules a task needs: the loaders prepare Minecraft for each module while configuring,
# so ':common:test' or one module's build would otherwise wait for all of them
org.gradle.configureondemand=true

# Mod
mod_version=0.1.0
maven_group=com.kasper.despawnindicator

# Minecraft 1.20.x on Fabric: three bands, as the networking changed in 1.20.2 and 1.20.5 (Java 21 from 1.20.5)
# 1.20 - 1.20.1
mc1200_minecraft=1.20.1
mc1200_fabric_loader=0.16.13
mc1200_fabric_api=0.92.6+1.20.1
# 1.20.2 - 1.20.4
mc1202_minecraft=1.20.4
mc1202_fabric_loader=0.16.13
mc1202_fabric_api=0.97.3+1.20.4
# 1.20.5 - 1.20.6
mc1205_minecraft=1.20.6
mc1205_fabric_loader=0.16.13
mc1205_fabric_api=0.100.8+1.20.6

# Minecraft 1.21.x on Fabric (Java 21): three bands, as the way items are drawn changed in 1.21.2 and 1.21.9.
# Each is compiled against the version below and runs on every version of its range (versions/fabric/1.21*)
# 1.21 - 1.21.1
mc1210_minecraft=1.21.1
mc1210_fabric_loader=0.16.13
mc1210_fabric_api=0.116.17+1.21.1
# 1.21.2 - 1.21.8
mc1212_minecraft=1.21.8
mc1212_fabric_loader=0.16.13
mc1212_fabric_api=0.136.1+1.21.8
mc1212_modmenu=15.0.0
# 1.21.9 - 1.21.11
mc1219_minecraft=1.21.11
mc1219_fabric_loader=0.19.5
mc1219_fabric_api=0.141.6+1.21.11

# Minecraft 26.x on Fabric (Java 25, unobfuscated) - compiled against 26.3, runs on 26.1 - 26.3
# (each band is checked on every release of its range by .github/workflows/compat.yml)
mc26_minecraft=26.3
mc26_fabric_loader=0.19.5
mc26_fabric_api=0.161.0+26.3
mc26_modmenu=21.0.0-beta.1

# Forge 1.20 - 1.20.1 (Java 17), remapped to Forge's runtime names by reobfJar. NeoForge for 1.20.1 is a
# fork of Forge and loads the same jar (net.neoforged:forge)
forge120_version=1.20.1-47.4.0
forge120_version_oldest=1.20-46.0.14
nf1201_forge=1.20.1-47.1.106

# NeoForge 1.21 - 1.21.1 (Java 21), compiled against the version below and, by .github/workflows/build.yml,
# against the oldest one
nf121_neoforge=21.1.172
nf121_neoforge_oldest=21.0.167
